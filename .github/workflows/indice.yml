name: Envíos
on:
  push:
    paths:
      - 'envios/**'
      - '!envios/envios.json'
      - '!envios/espejo.json'
      - '!envios/dosgames.json'
  workflow_dispatch:
    inputs:
      elegir:
        description: 'Elegir cosas nuevas para los años de curar.json (dosgames.com y archive.org)'
        type: boolean
        default: true
permissions:
  contents: write
concurrency: envios
jobs:
  envios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Elegir juegos de dosgames.com y cosas de archive.org
        if: github.event_name == 'workflow_dispatch' && inputs.elegir
        run: |
          python3 herramientas/dosgames.py || true
          python3 herramientas/curar.py || true
      - name: Copiar juegos, programas y revistas al repositorio
        run: python3 herramientas/espejo.py --revistas || true
      - run: python3 herramientas/indexar.py
      - name: Guardar
        run: |
          git add envios
          if ! git diff --cached --quiet; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git commit -m "Actualiza los envíos"
            git push
          fi
